[project]
name = "if5153-nlp-final-projects"
version = "0.1.0"
description = "Steam review summary generation: Phase 1 relevance filtering, Phase 2 ABSA, Phase 3 summarization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "tabulate>=0.10.0",
    "torch>=2.14.1",
    "transformers>=5.23.0",
    "vadersentiment>=3.3.2",
    "yake>=0.7.3",
    "polars>=1.0",
    "pyarrow",
    "numpy",
    "pyyaml",
    "requests",
    "tqdm",
    "torch>=2.5",
    "transformers>=4.45",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
# Only needed to rebuild the Phase 1 data and retrain the model, not to serve it.
train = [
    "pandas",
    "scikit-learn",
    "scipy",
    "datasets",
    "joblib",
    "langdetect",
    "fasttext-wheel",
    "pytest",
    "httpx",
    "ipykernel",
    "nbformat",
    "matplotlib>=3.11.2",
    "ipywidgets>=8.1.9",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
